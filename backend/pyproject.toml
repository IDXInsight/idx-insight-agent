[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idx-insight-agent"
version = "0.1.0"
description = "IDX Insight Agent — AI research and discovery assistant on Sectors data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "httpx>=0.27",  # runtime LLM providers (Gemini, Groq) call their REST APIs directly
]

[project.optional-dependencies]
dev = ["pytest>=8", "uvicorn>=0.30", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["idx_insight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is the framework idiom
