[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idx-insight-agent"
version = "0.1.0"
description = "IDX Insight Agent — AI research and discovery assistant on Sectors data"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
include = ["idx_insight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
